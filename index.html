<!DOCTYPE html>
<html lang="en">

    <main>
        <div class="map-container" id="map">

                fetch("./Assets/SVG-map/world.svg")

                });

        <div class="button-container">
            <div class="roulette-button" id="rbtn">
                <a>Roulette</a>
